name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this tag, for example v0.1.0 (empty: only build)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # git describe needs the tags for the package version
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext rpm appstream-util

      - name: Fetch Cockpit library and npm modules
        run: make pkg/lib/cockpit-po-plugin.js package-lock.json

      - name: Lint and type check
        run: |
          npm run eslint
          npm run stylelint
          npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Set package version for a manual release
        if: inputs.release != ''
        env:
          RELEASE: ${{ inputs.release }}
        run: echo "VERSION_ARG=VERSION=${RELEASE#v}" >> "$GITHUB_ENV"

      - name: Build release tarball
        run: NODE_ENV=production make dist $VERSION_ARG

      - name: Build RPM
        # BuildRequires are Fedora package names; the tools are installed above
        run: make rpm RPMBUILD_ARGS=--nodeps $VERSION_ARG

      - name: Build DEB
        run: make deb $VERSION_ARG

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            cockpit-docker-*.tar.xz
            cockpit-docker-*.noarch.rpm
            cockpit-docker_*_all.deb

  release:
    # a pushed v* tag, or a manual run that names the release tag
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
              # creates the tag on the built commit when it does not exist yet
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes ./*
          fi
